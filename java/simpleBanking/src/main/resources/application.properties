spring.application.name=banking-app

# H2 in-memory datasource
# Replaces the legacy sequential flat file (AccountFile / accounts.txt) with a
# relational store while preserving the same conceptual record structure.
spring.datasource.url=jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console (useful for local development / inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialise schema and seed data from src/main/resources/data.sql
spring.sql.init.mode=always

# Server
server.port=8080
